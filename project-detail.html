<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | Giras Matahari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandCream: '#FDFBF7',
                        brandBlue: '#082844',
                        brandYellow: '#FFD95A',
                        brandRed: '#FF6B6B',
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
        
        .reveal { 
            opacity: 0; 
            transform: translateY(20px); 
            transition: all 0.8s ease-out; 
        }
        
        .reveal.active { 
            opacity: 1; 
            transform: translateY(0); 
        }
    </style>
</head>
<body class="bg-brandCream text-brandBlue">

    <nav class="fixed top-0 w-full z-50 bg-brandCream/80 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="flex items-center gap-2">
                <img src="assets/components/images/Logo-Sun.png" alt="Logo" class="w-10 h-10 object-contain rounded-full">
            </div>
            </a>
            <a href="index.html" class="text-sm font-bold hover:text-brandRed transition">← Back to Home</a>
        </div>
    </nav>

    <main class="pt-32 pb-20 px-6 lg:px-20 overflow-x-hidden">
        <div class="max-w-6xl mx-auto">
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center mb-24">
                
                <div class="reveal order-2 lg:order-1">
                    <span id="projectTag" class="bg-brandYellow/30 text-brandBlue px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest mb-4 inline-block italic">
                        Loading...
                    </span>
                    <h1 id="projectTitle" class="text-4xl lg:text-6xl font-bold mb-6 leading-tight">
                        Loading...
                    </h1>
                    <p id="projectDescription" class="text-gray-600 text-lg mb-8 leading-relaxed">
                        </p>
                    
                    <div class="grid grid-cols-2 gap-8 border-t border-gray-200 pt-8">
                        <div>
                            <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2">Category</h4>
                            <p id="projectCategory" class="font-semibold text-brandBlue italic">Digital Solution</p>
                        </div>
                        <div>
                            <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2">Tech Stack</h4>
                            <p id="projectTech" class="font-semibold text-brandBlue">Loading...</p>
                        </div>
                    </div>
                </div>

                <div class="reveal order-1 lg:order-2 flex justify-center lg:justify-end">
                    
                    <div id="mobileMockup" class="hidden relative w-full flex justify-center lg:justify-end">
                        <div class="overflow-hidden rounded-[40px] shadow-2xl border-[12px] border-white transform lg:rotate-2 hover:rotate-0 transition duration-500">
                            <img id="mainMockupImg" src="" class="w-full max-w-[400px] h-auto object-cover" alt="Mobile Preview">
                        </div>
                    </div>

                    <div id="webMockup" class="hidden relative w-full max-w-[550px]">
                        <div class="bg-white border border-gray-200 rounded-t-xl shadow-2xl overflow-hidden">
                            <div class="bg-gray-100 py-3 px-4 flex gap-1.5 border-b border-gray-200">
                                <div class="w-3 h-3 rounded-full bg-red-400"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                                <div class="w-3 h-3 rounded-full bg-green-400"></div>
                            </div>
                            <img src="assets/components/images/project-1.jpeg" class="w-full h-auto" alt="Web Preview">
                        </div>
                    </div>
                </div>
            </div>

            <div class="reveal mb-24">
                <div class="flex flex-col mb-10">
                    <h2 class="text-3xl font-bold mb-2">Project Gallery</h2>
                    <div class="w-20 h-1.5 bg-brandYellow rounded-full"></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 overflow-hidden rounded-[32px] shadow-lg group">
                        <img id="gal-1" src="" class="w-full h-[300px] lg:h-[400px] object-cover group-hover:scale-105 transition duration-500" alt="Gallery 1">
                    </div>
                    <div class="overflow-hidden rounded-[32px] shadow-lg group">
                        <img id="gal-2" src="" class="w-full h-[300px] lg:h-[400px] object-cover group-hover:scale-105 transition duration-500" alt="Gallery 2">
                    </div>
                    <div class="overflow-hidden rounded-[32px] shadow-lg group">
                        <img id="gal-3" src="" class="w-full h-[300px] object-cover group-hover:scale-105 transition duration-500" alt="Gallery 3">
                    </div>
                    <div class="lg:col-span-2 overflow-hidden rounded-[32px] shadow-lg group">
                        <img id="gal-4" src="" class="w-full h-[300px] object-cover group-hover:scale-105 transition duration-500" alt="Gallery 4">
                    </div>
                </div>
            </div>

            <div class="reveal pt-16 border-t border-gray-200">
                <div class="flex justify-between items-end mb-10">
                    <div>
                        <p class="text-brandRed font-bold text-xs uppercase tracking-[0.3em] mb-2">Explore More</p>
                        <h2 class="text-3xl font-bold">Related Works</h2>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <a href="project-detail.html?type=mobile" class="group block bg-white rounded-[32px] p-4 shadow-sm hover:shadow-xl transition-all duration-500">
                        <div class="overflow-hidden rounded-[24px] mb-4">
                            <img src="assets/components/images/telu metaverse.png" alt="Metaverse" class="w-full h-[180px] object-cover group-hover:scale-110 transition duration-700">
                        </div>
                        <h3 class="font-bold group-hover:text-brandRed transition">Tel-U Metaverse</h3>
                    </a>
                    <a href="project-detail.html?type=web" class="group block bg-white rounded-[32px] p-4 shadow-sm hover:shadow-xl transition-all duration-500">
                        <div class="overflow-hidden rounded-[24px] mb-4">
                            <img src="assets/components/images/hotel-3.jpeg" alt="Hotel System" class="w-full h-[180px] object-cover group-hover:scale-110 transition duration-700">
                        </div>
                        <h3 class="font-bold group-hover:text-brandRed transition">Hotel Sawunggaling</h3>
                    </a>
                    <a href="project-detail.html?type=workout" class="group block bg-white rounded-[32px] p-4 shadow-sm hover:shadow-xl transition-all duration-500">
                        <div class="overflow-hidden rounded-[24px] mb-4">
                            <img src="assets/components/images/Logo-HomeWorkout.png" alt="Home Workout" class="w-full h-[180px] object-cover group-hover:scale-110 transition duration-700">
                        </div>
                        <h3 class="font-bold group-hover:text-brandRed transition">Home Workout App</h3>
                    </a>
                </div>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectType = urlParams.get('type');

        const elements = {
            tag: document.getElementById('projectTag'),
            title: document.getElementById('projectTitle'),
            category: document.getElementById('projectCategory'),
            tech: document.getElementById('projectTech'),
            desc: document.getElementById('projectDescription'),
            mob: document.getElementById('mobileMockup'),
            web: document.getElementById('webMockup'),
            mainImg: document.getElementById('mainMockupImg'),
            g1: document.getElementById('gal-1'),
            g2: document.getElementById('gal-2'),
            g3: document.getElementById('gal-3'),
            g4: document.getElementById('gal-4')
        };

        if (projectType === 'mobile') {
            // === TEL-U METAVERSE ===
            elements.mob.classList.remove('hidden');
            elements.mainImg.src = "assets/components/images/telu metaverse.png";
            elements.tag.innerText = "Featured Case Study";
            elements.title.innerText = "Tel-U Metaverse";
            elements.category.innerText = "Mobile Application";
            elements.tech.innerText = "Figma, Unity, C#, Mozilla Hubs";
            elements.desc.innerText = "Aplikasi TelU Verse merupakan aplikasi sebuah aplikasi yang terdiri dari beberapa teknologi seperti Augmented Reality (AR), Virtual Reality (VR), dan Geolocation.";
            
            elements.g1.src = "assets/components/images/metaverse.png";
            elements.g2.src = "assets/components/images/metaverse-2.png";
            elements.g3.src = "assets/components/images/metaverse-3.png";
            elements.g4.src = "assets/components/images/metaverse-4.png";

        } else if (projectType === 'workout') {
            // === HOME WORKOUT APP ===
            elements.mob.classList.remove('hidden');
            elements.mainImg.src = "assets/components/images/workout-8.png";
            elements.tag.innerText = "Health & Fitness";
            elements.title.innerText = "Home Workout App";
            elements.category.innerText = "Mobile Application";
            elements.tech.innerText = "Figma, Android Studio, Kotlin, Firebase";
            elements.desc.innerText = "Aplikasi Home Workout dirancang untuk membantu pengguna tetap bugar di rumah dengan panduan latihan harian tanpa alat. Fokus pada user experience yang memotivasi dan pelacakan progres yang intuitif.";
            
            elements.g1.src = "assets/components/images/workout-1.png";
            elements.g2.src = "assets/components/images/workout-5.png";
            elements.g3.src = "assets/components/images/workout-6.png";
            elements.g4.src = "assets/components/images/workout-7.png";

        } else {
            // === HOTEL SAWUNGGALING (DEFAULT) ===
            elements.web.classList.remove('hidden');
            elements.tag.innerText = "Website Development";
            elements.title.innerText = "Hotel Sawunggaling Dashboard";
            elements.category.innerText = "Web Development";
            elements.tech.innerText = "Figma, PHP, Laravel, CSS, SQL, Vue JS";
            elements.desc.innerText = "Membangun sistem monitoring hotel berbasis web yang menampilkan status dan tipe kamar, serta informasi housekeeping dan tamu secara real time.";

            elements.g1.src = "assets/components/images/hotel-3.jpeg";
            elements.g2.src = "assets/components/images/hotel-1.jpg";
            elements.g3.src = "assets/components/images/hotel-2.png";
            elements.g4.src = "assets/components/images/hotel-4.jpeg";
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('active');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    </script>
</body>
</html>
